[project]
name = "vgr-brand-index"
version = "0.1.0"
description = "Fashion-brand attention tracker ranking 60 brands on one 0-100 scale from free public sources"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
vgr-resolve = "vgr_brand_index.resolve:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
